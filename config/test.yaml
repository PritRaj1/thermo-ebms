model:
  z_dim: 21
  seed: 0
  base: kaem

  ebm:
    layer_widths: [100, 100]
    leakyrelu_leak: 0.1
    p0_stddev: 1.0
    mcmc:
      stepsize: 0.01
      numsteps: 5


  gen:
    gaussian_stddev: 0.3
    leakyrelu_leak: 0.1
    groupnorm: False
    blocks:
      - channels: 16
        kernel_size: 4
        stride: 1
        padding: VALID
      - channels: 8
        kernel_size: 4
        stride: 2
        padding: SAME
      - channels: 4
        kernel_size: 4
        stride: 2
        padding: SAME
    img_channels: 3
    mcmc:
      stepsize: 0.01
      numsteps: 5


  kaem:
    mixture: False
    numquad: 25
    degree: 3

  thermo:
    num_temps: 3
    xchange_every: 2
    annealing_cycle: 0
    powerlaw_start: 6
    powerlaw_end: 6

optim:
  gen:
    lr_init: 1e-3
    lr_end: 5e-4
    lr_decay: 0.998
    beta1: 0.999
    beta2: 0.5
    decay_begin: 0
    decay_step: 0
  ebm:
    lr_init: 2e-4
    lr_end: 1e-4
    lr_decay: 0.998
    beta1: 0.999
    beta2: 0.5
    decay_begin: 0
    decay_step: 0
  kaem:
    lr_init: 2e-4
    lr_end: 1e-4
    lr_decay: 0.975
    beta1: 0.999
    beta2: 0.5
    decay_begin: 0
    decay_step: 0


training:
  epochs: 1
  global_batch_size: 32
  dataset: fake32
  image_res: 32

logging:
  logdir: /tmp
  ckpt_dir: /tmp
  ckpt_every: 1
  sample_every: 1
  num_samples: 10

unbiased_metrics:
  batch_size_to_generate: 50
  num_samples: 50
  regression_steps: [1000, 1200, 1300]


