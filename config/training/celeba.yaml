dataset: celeb_a
epochs: 200
global_batch_size: 32
image_res: 64
is_finetune:
  type: residual
  epochs: 100
  optim:
    gen:
      lr_init: 1e-5
      lr_end: 2e-5
      weight_decay: 1e-4
      beta1: 0.999
      beta2: 0.9
      warmup_fraction: 0.05
    ebm:
      lr_init: 2e-6
      lr_end: 5e-7
      weight_decay: 1e-5
      beta1: 0.999
      beta2: 0.9
      warmup_fraction: 0.05
    kaem:
      lr_init: 2e-6
      lr_end: 4e-7
      weight_decay: 1e-5
      beta1: 0.999
      beta2: 0.9
      warmup_fraction: 0.05

model_overrides:
  gen:
    blocks:
      - channels: 256
        kernel_size: 4
        stride: 1
        padding: VALID
      - channels: 128
        kernel_size: 4
        stride: 2
        padding: SAME
      - channels: 64
        kernel_size: 4
        stride: 2
        padding: SAME
      - channels: 32
        kernel_size: 4
        stride: 2
        padding: SAME
